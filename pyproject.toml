[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agntia-video"
version = "0.3.0"
description = "Un estudio de podcast con briefing conversacional y edición revisable"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "playwright>=1.49,<2"]

[tool.setuptools.package-data]
agntia = ["static/*", "resources/*"]

[tool.setuptools.packages.find]
include = ["agntia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
